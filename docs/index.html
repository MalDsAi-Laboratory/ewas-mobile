<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ScrapIt — Download the Android app for e-waste collection and recycling." />
  <title>ScrapIt — Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #22c55e;
      --green-dark:  #16a34a;
      --green-glow:  rgba(34, 197, 94, 0.2);
      --bg:          #080f14;
      --surface:     #0f1e17;
      --card:        #132110;
      --border:      rgba(34, 197, 94, 0.18);
      --text:        #f0fdf4;
      --muted:       #6b7280;
      --subtle:      #374151;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.75rem;
      padding: 2.75rem 2.5rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(34, 197, 94, 0.05),
        0 32px 64px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(34, 197, 94, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34,197,94,0.5), transparent);
    }

    /* ── Logo ── */
    .logo-wrap {
      width: 84px;
      height: 84px;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, #16a34a 0%, #059669 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35);
      font-size: 2.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #f0fdf4 0%, #86efac 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.925rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* ── Release info chip ── */
    .release-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 2rem;
      padding: 0.3rem 0.85rem;
      font-size: 0.78rem;
      color: #86efac;
      margin-bottom: 1.75rem;
      font-weight: 500;
    }
    .release-badge .dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Action area ── */
    #action { min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* ── Download button ── */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: #fff;
      text-decoration: none;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 24px rgba(34, 197, 94, 0.35);
      border: none;
      cursor: pointer;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(34, 197, 94, 0.5);
    }
    .btn-download:active { transform: translateY(0); }

    .btn-download svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
    }

    /* ── iOS / unsupported states ── */
    .btn-disabled {
      width: 100%;
      background: var(--subtle);
      color: var(--muted);
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 1.05rem;
      border: none;
      cursor: not-allowed;
    }

    /* ── Install steps ── */
    .steps {
      margin-top: 1.25rem;
      text-align: left;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 0.875rem;
      padding: 1rem 1.25rem;
      width: 100%;
    }
    .steps p {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.8;
    }
    .steps p strong { color: #d1fae5; }

    /* ── File info row ── */
    .file-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding: 0.6rem 0.9rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 0.65rem;
      width: 100%;
    }
    .file-info span { font-size: 0.78rem; color: var(--muted); }
    .file-info span.name { color: #9ca3af; font-weight: 500; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

    /* ── Spinner ── */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(34, 197, 94, 0.15);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 0.875rem; }

    /* ── Error state ── */
    .error-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .error-text { color: #f87171; font-size: 0.875rem; line-height: 1.6; }
    .error-text a { color: #fca5a5; }

    /* ── Footer ── */
    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.7;
    }
    footer a { color: #4b7c59; text-decoration: none; }
    footer a:hover { color: var(--green); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; border-radius: 1.25rem; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">♻️</div>
    <h1>ScrapIt</h1>
    <p class="tagline">E-waste collection, simplified.<br/>Connect with recyclers near you.</p>

    <div id="release-badge">
      <!-- filled by JS -->
    </div>

    <div id="action">
      <div class="spinner"></div>
      <p class="loading-text">Fetching latest build…</p>
    </div>
  </div>

  <footer>
    <p>ScrapIt by <a href="https://github.com/MalDsAi-Laboratory" target="_blank" rel="noopener">MalDsAi Laboratory</a></p>
    <p style="margin-top:0.3rem;">Android only · APK sideload · Development build</p>
  </footer>

  <script>
    const REPO = 'MalDsAi-Laboratory/ewas-mobile';
    const API  = `https://api.github.com/repos/${REPO}/releases?per_page=1`;

    const ua        = navigator.userAgent || '';
    const isAndroid = /android/i.test(ua);
    const isIOS     = /iphone|ipad|ipod/i.test(ua);

    const badgeEl  = document.getElementById('release-badge');
    const actionEl = document.getElementById('action');

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function fmtBytes(bytes) {
      if (!bytes) return '';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function renderAndroid(asset, release) {
      badgeEl.innerHTML = `
        <div class="release-badge">
          <span class="dot"></span>
          ${release.name} &nbsp;·&nbsp; ${fmtDate(release.published_at)}
        </div>`;

      actionEl.innerHTML = `
        <a class="btn-download" href="${asset.browser_download_url}" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download APK
        </a>

        <div class="file-info">
          <span class="name">${asset.name}</span>
          <span>${fmtBytes(asset.size)}</span>
        </div>

        <div class="steps">
          <p>
            <strong>1.</strong> Tap Download APK above<br/>
            <strong>2.</strong> Open the downloaded file<br/>
            <strong>3.</strong> Settings → Security → <strong>Allow unknown sources</strong><br/>
            <strong>4.</strong> Tap <strong>Install</strong> and you're good to go
          </p>
        </div>`;
    }

    function renderIOS() {
      badgeEl.innerHTML = '';
      actionEl.innerHTML = `
        <button class="btn-disabled" disabled>Not available on iOS</button>
        <div class="steps">
          <p>
            ScrapIt is currently <strong>Android only</strong>.<br/>
            iOS (TestFlight) support is coming soon!<br/><br/>
            To install on Android, open this link on your Android device.
          </p>
        </div>`;
    }

    function renderDesktop(asset, release) {
      badgeEl.innerHTML = `
        <div class="release-badge">
          <span class="dot"></span>
          ${release.name} &nbsp;·&nbsp; ${fmtDate(release.published_at)}
        </div>`;

      actionEl.innerHTML = `
        <a class="btn-download" href="${asset.browser_download_url}" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download APK
        </a>

        <div class="file-info">
          <span class="name">${asset.name}</span>
          <span>${fmtBytes(asset.size)}</span>
        </div>

        <div class="steps">
          <p>
            Scan the page URL on your Android device to download directly,<br/>
            or transfer the APK via USB/cloud and tap to install.
          </p>
        </div>`;
    }

    function renderError() {
      badgeEl.innerHTML = '';
      actionEl.innerHTML = `
        <div class="error-icon">⚠️</div>
        <p class="error-text">
          Could not load the latest release.<br/>
          <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">
            Visit GitHub Releases directly →
          </a>
        </p>`;
    }

    // ── Fetch latest release from GitHub API ──
    fetch(API, { headers: { Accept: 'application/vnd.github+json' } })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(releases => {
        const release = Array.isArray(releases) ? releases[0] : releases;
        if (!release) throw new Error('No releases found');
        const asset = release.assets && release.assets.find(a => a.name.endsWith('.apk'));
        if (!asset) throw new Error('No APK asset found');

        if (isIOS) {
          renderIOS();
        } else if (isAndroid) {
          renderAndroid(asset, release);
        } else {
          renderDesktop(asset, release);
        }
      })
      .catch(() => {
        // fallback: try direct releases page
        if (isIOS) {
          renderIOS();
        } else {
          renderError();
        }
      });
  </script>
</body>
</html>
