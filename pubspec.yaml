name: simple_ui
description: A simple Flutter UI

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  audioplayers: ^6.3.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  device_preview_plus: ^2.2.4
  dio: ^5.8.0+1
  drop_down_search_field: ^1.1.2+2
  easy_debounce: ^2.0.3
  easy_stepper: ^0.8.5+1
  firebase_analytics: ^11.4.4
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: 17.2.1+2
  flutter_map: ^7.0.2
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  geolocator: ^13.0.2
  get: ^4.6.6
  google_fonts: ^6.2.1
  googleapis_auth: ^1.6.0
  image_picker: ^1.1.2
  just_audio: ^0.9.46
  latlong2: ^0.9.1
  location: ^8.0.0
  retry: ^3.1.2
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/scrapit_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/scrapit_logo.png"
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/ringtone.mp3