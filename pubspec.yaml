name: simple_ui
description: E-waste marketplace connecting sellers, recyclers, and delivery agents.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  drop_down_search_field: ^1.3.0
  easy_debounce: ^2.0.3
  easy_stepper: ^1.1.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  geolocator: ^13.0.2
  get: ^4.6.6
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  latlong2: ^0.9.1
  location: ^8.0.0
  path_provider: ^2.1.5
  retry: ^3.1.2
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  device_preview_plus: ^2.7.1
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/image.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/image.png"
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
