plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ewaste.ewas"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            def keyPropsFile = rootProject.file('key.properties')
            if (keyPropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keyPropsFile))
                keyAlias     = props['keyAlias']
                keyPassword  = props['keyPassword']
                storeFile    = file(props['storeFile'])
                storePassword = props['storePassword']
            }
            // If key.properties is absent (CI without secrets / dev machine)
            // fall back to the debug keystore so the build still succeeds.
            // Replace with a real keystore before submitting to Play Store.
            else {
                keyAlias     = "androiddebugkey"
                keyPassword  = "android"
                storeFile    = file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword = "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.ewaste.ewas"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
